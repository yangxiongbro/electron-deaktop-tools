appId: com.electron.deaktoptools
productName: DevToolbox
copyright: Copyright © 2026 electron-deaktop-tools

directories:
  buildResources: build
  output: release/${version}

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/{.eslintrc,.editorconfig,.prettierrc,README.md,README}'

# 跨网络聊天用的 frpc：把可执行文件放进 resources/frp（见该目录的 README），
# 打包后位于 <安装目录>/resources/frp/frpc(.exe)，程序会自动找到它
extraResources:
  - from: resources/frp
    to: frp
    filter:
      - '**/*'
      - '!README.md'

asar: true
compression: normal
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

win:
  executableName: DevToolbox
  icon: build/icon.ico
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  target:
    - nsis
    - zip

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DevToolbox
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}

linux:
  icon: build/icons
  category: Development
  executableName: devtoolbox
  # deb 包必须有维护者信息（作者未配置 email 时 electron-builder 会直接报错）
  maintainer: yangxiongbro <yangxiongbro@users.noreply.github.com>
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  target:
    - AppImage
    - deb

appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
