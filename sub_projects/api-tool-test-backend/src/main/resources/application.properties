spring.application.name=api-tool-test-backend

server.port=${SERVER_PORT:8080}

# 请求/响应统一使用 UTF-8，避免中文参数出现乱码
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force-response=true

# multipart/form-data 上传限制
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=1MB

# 测试接口会打印完整请求；这里只保留项目包内的 INFO 日志
logging.level.org.example.apitooltestbackend=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
